name: version consistency check

# Validates that `version.py`, the resolved `pyproject.toml` version,
# and the top non-`[Unreleased]` heading in `CHANGELOG.md` all agree.
#
# Path-filtered on PRs so most PRs don't run the check at all — only
# the ones that touch versioning files. Always runs on push to main
# (catches the case where a release PR was merged without one of the
# three files bumped) and via manual dispatch.

on:
  pull_request:
    paths:
      - 'version.py'
      - 'pyproject.toml'
      - 'CHANGELOG.md'
      - 'scripts/check_version_consistency.py'
      - '.github/workflows/version-check.yml'
  push:
    branches: [main]
    paths:
      - 'version.py'
      - 'pyproject.toml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: version consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install package (needed for dynamic-version resolution)
        run: pip install -e .

      - name: Run version consistency check
        run: python scripts/check_version_consistency.py
