name: LDR PR code review (reusable)

# Reusable workflow that researches a labeled GitHub Pull Request via
# Local Deep Research and posts the result as a comment on the PR.
# Triggered indirectly: the caller workflow in the consumer's repo
# handles the `pull_request: labeled` event and invokes this workflow.
#
# Two modes:
#   - diff   (default): fetch the PR's diff and feed it to LDR
#   - static: run a fixed query (smoke-test the pipeline without
#             depending on the PR's actual content)

on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: 'Git ref of this toolkit repo to check out (must match the ref in `uses:`).'
        type: string
        required: true
      mode:
        description: '"diff" (research the PR''s changes) or "static" (run a fixed query).'
        type: string
        default: 'diff'
      static-query:
        description: 'Query used when mode=static. Ignored in diff mode.'
        type: string
        default: 'What is Local Deep Research and how does it work?'
      prompt-template-ref:
        description: 'Prompt template name from scripts/prompt_templates/ for diff mode.'
        type: string
        default: 'pr_diff_review'
      project-name:
        description: 'Project name to inject into the prompt (e.g. "My Project").'
        type: string
        default: ''
      max-diff-bytes:
        description: 'PR diff is truncated to this many bytes before embedding.'
        type: number
        default: 8000
      prompt-prefix:
        description: 'Optional extra text prepended to the assembled prompt.'
        type: string
        default: ''
      prompt-suffix:
        description: 'Optional extra text appended to the assembled prompt.'
        type: string
        default: ''
      comment-header:
        description: 'Override the comment header line. Empty = script-default per mode.'
        type: string
        default: ''
      comment-footer:
        description: 'Comment footer line.'
        type: string
        default: '_Generated by [Local Deep Research](https://github.com/LearningCircuit/local-deep-research) via [ldr-automations](https://github.com/LearningCircuit/ldr-automations)._'
      remove-label-after:
        description: 'Remove the trigger label after the workflow finishes.'
        type: boolean
        default: true
      model:
        description: 'LLM model slug. Empty = LDR default.'
        type: string
        default: ''
      provider:
        description: 'LLM provider.'
        type: string
        default: 'openrouter'
      search-tool:
        description: 'Search tool.'
        type: string
        default: 'serper'
      strategy:
        description: 'LDR search strategy.'
        type: string
        default: 'langgraph-agent'
      iterations:
        description: 'Override the strategy iteration cap. 0 = strategy default.'
        type: number
        default: 0
      max-sources:
        description: 'Cap sources rendered in the comment.'
        type: number
        default: 10
      runner:
        description: 'Runner label.'
        type: string
        default: 'ubuntu-latest'
    secrets:
      OPENROUTER_API_KEY:
        required: true
      SERPER_API_KEY:
        required: true
    outputs:
      success:
        description: "'true' if LDR returned valid non-error JSON and the comment was posted."
        value: ${{ jobs.post-comment.outputs.posted }}
      comment-url:
        description: 'URL of the posted comment (empty if posting was skipped).'
        value: ${{ jobs.post-comment.outputs.comment-url }}

permissions: {}

jobs:
  build-query:
    name: Assemble query
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      query: ${{ steps.assemble.outputs.query }}
      header: ${{ steps.assemble.outputs.header }}
      subheader: ${{ steps.assemble.outputs.subheader }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout toolkit at requested ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: LearningCircuit/ldr-automations
          ref: ${{ inputs.toolkit-ref }}
          persist-credentials: false
          path: ldr-automations
          sparse-checkout: |
            scripts
          fetch-depth: 1

      - name: Checkout caller PR (for diff mode)
        if: inputs.mode == 'diff'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: caller
          fetch-depth: 0

      - name: Extract PR diff
        if: inputs.mode == 'diff'
        working-directory: caller
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git diff "origin/$BASE_REF...HEAD" --no-color > ../diff.txt
          echo "Diff size: $(wc -c < ../diff.txt) bytes"

      - name: Assemble query
        id: assemble
        working-directory: ldr-automations
        env:
          MODE: ${{ inputs.mode }}
          STATIC_QUERY: ${{ inputs.static-query }}
          TEMPLATE_REF: ${{ inputs.prompt-template-ref }}
          PROJECT_NAME: ${{ inputs.project-name }}
          DIFF_PATH: ${{ github.workspace }}/diff.txt
          MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
          PROMPT_PREFIX: ${{ inputs.prompt-prefix }}
          PROMPT_SUFFIX: ${{ inputs.prompt-suffix }}
        run: |
          python scripts/build_pr_query.py

      - name: Log refs for debugging
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "toolkit-ref input was: $TOOLKIT_REF"
          echo "mode input was: $MODE"

  research:
    name: Run LDR research
    needs: build-query
    # Grant the perms the LDR reusable's job needs:
    # - contents: read for actions/checkout
    # - actions: write for actions/upload-artifact@v5+
    permissions:
      contents: read
      actions: write
    uses: LearningCircuit/local-deep-research/.github/workflows/ldr-research-reusable.yml@c2a47a83b3098c96d6857a010e49dc627efb7a90 # v1.6.10
    with:
      query: ${{ needs.build-query.outputs.query }}
      model: ${{ inputs.model }}
      provider: ${{ inputs.provider }}
      search-tool: ${{ inputs.search-tool }}
      strategy: ${{ inputs.strategy }}
      iterations: ${{ inputs.iterations }}
      max-sources: ${{ inputs.max-sources }}
      runner: ${{ inputs.runner }}
      comment-header: ${{ inputs.comment-header || needs.build-query.outputs.header }}
      comment-subheader: ${{ needs.build-query.outputs.subheader }}
      comment-footer: ${{ inputs.comment-footer }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

  post-comment:
    name: Post PR comment
    needs: research
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      posted: ${{ steps.post.outputs.posted }}
      comment-url: ${{ steps.post.outputs.comment-url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      LABEL_NAME: ${{ github.event.label.name }}
      REMOVE_LABEL_AFTER: ${{ inputs.remove-label-after }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Download research artifact
        if: needs.research.outputs.success == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.research.outputs.comment-artifact-name }}

      - name: Post comment
        id: post
        if: needs.research.outputs.success == 'true'
        run: |
          URL=$(gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            -F comment.md)
          echo "comment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Mark unposted on failure
        if: needs.research.outputs.success != 'true'
        run: |
          echo "comment-url=" >> "$GITHUB_OUTPUT"
          echo "posted=false" >> "$GITHUB_OUTPUT"

      - name: Remove label for re-triggering
        if: always() && env.REMOVE_LABEL_AFTER == 'true' && env.LABEL_NAME != ''
        run: |
          gh issue edit "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --remove-label "$LABEL_NAME" 2>/dev/null || true
