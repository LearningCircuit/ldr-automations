[project]
name = "ldr-automations"
dynamic = ["version"]
description = "Helper scripts for LDR-powered CI automations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LearningCircuit" }]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Toolkit is workflow-first; the `scripts/` Python helpers are
# imported by the workflows via PYTHONPATH/sys.path, not installed
# as a package. Just expose `version.py` so `attr: version.__version__`
# resolves.
py-modules = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
